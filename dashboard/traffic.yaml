                {% if 'construction' in (state_attr(entity, 'event_type') or '') %}
                  mdi:traffic-cone
                {% else %}
                  mdi:car-wrench
                {% endif %}
              color: >-
                {% set sev = state_attr(entity, 'severity') | int(3) %}
                {% if sev <= 2 %}
                  red
                {% elif sev <= 3 %}
                  orange
                {% else %}
                  amber
                {% endif %}
              primary: "{{ (state_attr(entity, 'road') or '') | trim or 'Active incident' }}"
              secondary: "{{ state_attr(entity, 'friendly_name') | replace('The 511 ', '') }}"
              multiline_secondary: true
              tap_action:
                action: more-info

          - type: map
            geo_location_sources:
              - The 511
            card_mod:
              style: |
                ha-card {
                  border-radius: 18px;
                  overflow: hidden;
                }

      # ---------- Cameras ----------
      - type: custom:text-divider-row
        text: Traffic Cameras
        style:
          divider-color: "rgba(var(--rgb-primary-color), 0.35)"
          text-color: "var(--secondary-text-color)"
          text-size: 13px
          margin: "14px 0 4px 0"

      - type: picture-glance
        entity: camera.the_511_i_39_90_94_at_us_51
        name: I-39/90/94 at US 51
        show_state: false
        show_name: true
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              overflow: hidden;
            }

      - type: custom:layout-card
        layout_type: grid
        columns:
          mobile: 1
          desktop: 3
        max_width: 1500px
        cards:
          - type: custom:auto-entities
            filter:
              template: |
                {% for e in states.camera %}
                  {% if e.entity_id.startswith('camera.the_511_') %}
                    {{ e.entity_id }},
                  {% endif %}
                {% endfor %}
            sort:
              method: attribute
              attribute: road
              ignore_case: true
            card:
              type: picture-glance
              camera_image: this.entity_id
              aspect_ratio: "16:9"
              show_state: false
              show_name: true
              card_mod:
                style: |
                  ha-card {
                    border-radius: 14px;
                    overflow: hidden;
                  }

      # ---------- Footer ----------
      - type: markdown
        content: |
          *Last updated {{ now().strftime('%-I:%M %p') }} · Refreshes every 5 min · Camera snapshots update on demand · The 511 Wisconsin*
        card_mod:
          style: |
            ha-card {
              background: transparent;
              border: none;
              box-shadow: none;
              text-align: center;
            }
            ha-card .markdown em {
              color: var(--secondary-text-color);
            }

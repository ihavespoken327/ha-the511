# dashboard/traffic.yaml
# The 511 traffic dashboard (Wisconsin). Single masonry view, ready to paste:
# drop this file's `views:` key into a Lovelace YAML dashboard, or use the
# whole file for a one-view dashboard. Tested against HA 2026.7.4 with
# mushroom, button-card, auto-entities, layout-card, card-mod,
# mini-graph-card and text-divider-row installed.
#
# The incident and camera sections are dynamic (auto-entities), so new
# alerts and cameras appear automatically. Road-condition and travel-time
# cards are hand-picked from the entity bounds (max 25 each) and colour
# themselves from state/delay.
#
# button_card_templates: shared card templates. If you paste only the
# `views:` key into another YAML dashboard, carry this block (or merge it
# into that dashboard's existing button_card_templates) so vms_sign_card
# cards render.

button_card_templates:
  vms_sign_card:
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    styles:
      card:
        - background: "#0c0c0c"
        - border: |-
            [[[
              return Number(entity.attributes.delay || 0) > 0 
                ? '3px solid #FFC107' 
                : '3px solid #6a6a6a';
            ]]]
        - border-radius: 3px
        - height: 120px
        - padding: 0
        - overflow: hidden
        - position: relative
      custom_fields:
        header:
          - position: absolute
          - top: 8px
          - left: 0
          - width: 100%
          - text-align: center
          - color: "#ffb300"
          - font-size: 17px
          - font-family: monospace
          - letter-spacing: 4px
          - text-shadow: 0 0 2px rgba(255,176,0,0.75)
        route:
          - position: absolute
          - top: 42px
          - left: 18px
          - color: "#ffb300"
          - font-size: 24px
          - font-family: monospace
          - text-shadow: 0 0 2px rgba(255,176,0,0.75)
        destination:
          - position: absolute
          - top: 78px
          - left: 18px
          - color: "#ffb300"
          - font-size: 27px
          - font-family: monospace
          - text-shadow: 0 0 2px rgba(255,176,0,0.75)
        minutes:
          - position: absolute
          - top: 42px
          - right: 30px
          - color: "#ffb300"
          - font-size: 40px
          - font-family: monospace
          - font-weight: bold
          - line-height: 1
          - text-align: right
          - text-shadow: 0 0 2px rgba(255,176,0,0.75)
        delay:
          - position: absolute
          - top: 95px
          - right: 20px
          - width: 80px
          - text-align: center
          - color: "#ff5252"
          - font-size: 13px
          - font-family: monospace
          - font-weight: bold
          - text-shadow: 0 0 2px rgba(255,82,82,0.75)
    custom_fields:
      header: |
        [[[ return "MINUTES TO"; ]]]
      route: |
        [[[
          const road = entity.attributes.road || "";
          const dirMatch = entity.attributes.friendly_name ? entity.attributes.friendly_name.match(/\b(EB|WB|NB|SB)\b/i) : null;
          const dir = dirMatch ? dirMatch[1].toUpperCase() : "";
          return `${road} ${dir}`.trim();
        ]]]
      destination: |
        [[[
          const match = entity.attributes.friendly_name ? entity.attributes.friendly_name.match(/to (.*)/i) : null;
          return match ? match[1].toUpperCase() : "";
        ]]]
      minutes: |
        [[[ return Math.round(Number(entity.state)); ]]]
      delay: |
        [[[
          const delay = Number(entity.attributes.delay || 0);
          if (delay <= 0) return "";
          return `+${delay} MIN`;
        ]]]

views:
  - title: Traffic
    path: traffic
    icon: mdi:traffic-light
    theme: Blackout
    type: masonry
    cards:
      # ---------- Hero ----------
      - type: markdown
        content: |
          # The 511 — Live Traffic
          **Wisconsin roads · cameras · incidents**
        card_mod:
          style: |
            ha-card {
              background:
                linear-gradient(135deg, rgba(var(--rgb-primary-color), 0.20), rgba(0, 0, 0, 0) 55%),
                var(--ha-card-background);
              border: 1px solid rgba(var(--rgb-primary-color), 0.25);
              border-radius: 20px;
              padding: 4px 18px 10px 18px;
            }
            ha-card .markdown h1 {
              margin: 10px 0 0;
              font-size: 2rem;
              line-height: 1.1;
            }
            ha-card .markdown strong {
              color: var(--secondary-text-color);
              font-weight: 500;
            }

      # ---------- Status row ----------
      - type: custom:layout-card
        layout_type: grid
        columns:
          mobile: 2
          desktop: 4
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{ (states.binary_sensor | selectattr('entity_id', 'search', 'the_511')
                 | selectattr('state', 'eq', 'on') | list | count) }}
            secondary: Active incidents
            icon: mdi:car-wrench
            color: >-
              {% if (states.binary_sensor | selectattr('entity_id', 'search', 'the_511')
                     | selectattr('state', 'eq', 'on') | list | count) > 0 %}
                red
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: >-
              {% set rc = states.sensor | selectattr('entity_id', 'search', 'the_511')
                 | selectattr('attributes.surface', 'defined') | list %}
              {{ (rc | selectattr('state', 'ne', 'Normal') | list | count) }}
            secondary: Roads impacted
            icon: mdi:highway
            color: >-
              {% set rc = states.sensor | selectattr('entity_id', 'search', 'the_511')
                 | selectattr('attributes.surface', 'defined') | list %}
              {% if (rc | selectattr('state', 'ne', 'Normal') | list | count) > 0 %}
                amber
              {% else %}
                green
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: "{{ now().strftime('%-I:%M %p') }}"
            secondary: "{{ now().strftime('%A, %b %-d') }}"
            icon: mdi:clock-outline
            color: amber

          - type: custom:mushroom-entity-card
            entity: update.the_511_update
            name: Integration
            icon: mdi:cloud-check-outline
            tap_action:
              action: more-info

      # ---------- Road conditions ----------
      - type: custom:text-divider-row
        text: Road Conditions
        style:
          divider-color: "rgba(var(--rgb-primary-color), 0.35)"
          text-color: "var(--secondary-text-color)"
          text-size: 13px
          margin: "14px 0 4px 0"

      - type: custom:layout-card
        layout_type: grid
        columns:
          mobile: 2
          desktop: 4
        cards:
          - type: custom:button-card
            entity: sensor.the_511_i_39_i_90_i_94
            name: I-39/90/94
            icon: mdi:highway
            layout: icon_state_name2d
            show_name: true
            show_state: true
            styles:

            state:
              - value: Normal
                styles:
                  card:
                    - border: 1px solid rgba(var(--rgb-green), 0.35)
                  icon:
                    - color: var(--green)
                  state:
                    - color: var(--green)
              - value: Wet
                styles:
                  card:
                    - border: 1px solid rgba(var(--rgb-blue), 0.35)
                  icon:
                    - color: var(--blue)
